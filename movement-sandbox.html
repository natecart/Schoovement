<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Movement Sandbox</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1d24; font-family: sans-serif; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 12px; left: 12px; color: #eef; font-size: 13px;
    line-height: 1.5; text-shadow: 0 1px 2px black; user-select: none; pointer-events: none;
  }
  #hud b { color: #ffd479; }
</style>
</head>
<body>
<div id="hud"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
// ---------------------------------------------------------------------------
// Movement stats — see movement-sandbox-design.md for the feel targets these
// are meant to hit. These are first-pass numbers to tune by feel, not final.
// ---------------------------------------------------------------------------
// Tuned toward Melee Fox's ratios (twitchy ground game, tighter relative air
// control, heavier/snappier fall, a double jump that goes HIGHER than the
// first jump). Exact numbers don't port across unit systems, so these are
// our own values scaled by Fox's ratios, not literal conversions.
const STATS = {
  groundMaxSpeed: 14,
  groundAccel: 240,
  groundDecel: 110,
  gravity: 85,       // was 72; a little heavier again for a faster-feeling arc
  maxFallSpeed: 33,   // was 28, scaled up with gravity
  jumpSpeed: 27.5,    // was 25.3; recalculated so jump HEIGHT is unchanged
                       // (~4.44) despite the higher gravity — shorter hang
                       // time instead, which reads as faster
  doubleJumpSpeed: 31.2, // was 28.7; recalculated the same way, keeping the
                          // double jump at ~128% of the first jump's height
  // Fast-fall: pressing down while already falling (not still rising)
  // instantly snaps you to a faster terminal velocity for the rest of that
  // fall. Ratio to Max Fall Speed (~1.15x) is toward the low end of
  // Melee's typical range (was ~1.3x, felt too fast).
  fastFallSpeed: 38,
  airAccel: 36,
  // Air friction: a separate, weaker deceleration that only applies when no
  // direction is held in the air (Melee has this; we were missing it
  // entirely, which is why letting go mid-air did nothing). Scaled to ~25%
  // of Air Acceleration, matching Fox's real friction/accel ratio.
  airFriction: 6,
  maxAirSpeed: 8,     // was 5.3; Fox's air speed is only ~38% of his run
                      // speed (tighter than the 50% we had), not floatier
};

// Purely cosmetic — doesn't feed back into physics/rollback state.
const ANIM = {
  legSwingMax: 0.9,          // radians, full leg swing amplitude at max ground speed
  gaitCyclesPerSecAtMax: 2.2,// full stride cycles per second at max ground speed
  legEaseRate: Math.PI * 10, // radians/sec, how fast a leg eases toward its target angle
  // Knee bend: peaks during forward swing (foot clearance), stays near
  // straight during stance/push-off. First-pass approximation, not a real
  // IK solve — likely needs tuning once seen in motion.
  kneeBendMax: 1.1,
  // Default airborne pose ("Marth jump"): one leg trails back, the other
  // drives up with a bent knee (basketball-dunk-style knee raise), plus an
  // asymmetric arm pose — one arm ("sword arm") extended, the other relaxed
  // and trailing.
  jumpPoseLegAngle: -0.45,       // trailing leg, hip
  jumpPoseKneeAngle: 0.25,       // trailing leg, knee (mostly straight)
  jumpPoseRaisedLegAngle: 1.0,   // driven-up leg, hip (raised and forward)
  jumpPoseRaisedKneeAngle: 1.0,  // driven-up leg, knee (folded under)
  jumpPoseSwordArmAngle: 0.9,
  jumpPoseOffArmAngle: -0.25,
  // Which side is "active" (raised leg + sword arm) flips between the first
  // jump and the double jump — see player.jumpPoseFlipped — so the pose
  // doesn't just repeat itself.
  // A small continuous sine wiggle on the active leg/arm so the pose reads
  // as alive rather than a frozen snapshot for the whole flight.
  jumpPoseWiggleAmplitude: 0.08, // radians
  jumpPoseWiggleFreq: Math.PI * 5, // radians/sec (~2.5 wiggles per second)
  // Hip/shoulder counter-rotation: while airborne, the pelvis twists (yaw)
  // to bring the raised leg's hip forward, and the upper body twists the
  // opposite way (shoulders lead on the trailing-leg side) — the athletic
  // torque you get any time one leg drives forward. Only active airborne.
  bodyTwistMax: 0.25, // radians, pelvis twist
  bodyTwistEaseRate: 6, // radians/sec
  shoulderCounterTwistFactor: 1.0, // upperBody twist = -bodyTwist * this
  // Double-jump tuck: legs snap to a tighter tuck for a moment right when
  // you double-jump, then relax back to the jumpPoseLegAngle pose above.
  doubleJumpTuckAngle: 1.15,
  doubleJumpTuckDuration: 0.18, // seconds
  // Squash (landing) / stretch (takeoff): one signed value drives both —
  // negative squashes, positive stretches, both ease back to 0. Applied to
  // the character's scale in the render loop.
  landingSquashKick: -0.3,
  takeoffStretchKick: 0.22,
  stretchEaseRate: 1.6, // units/sec, how fast bodyStretch returns to 0
  // Turn dust: only puffs if you were already going at least this fraction
  // of Ground Max Speed when you reversed — keeps small wiggles silent.
  turnDustSpeedFraction: 0.5,
  // Arms swing opposite their same-side leg (contralateral gait): armL
  // shares legR's phase and vice versa. Smaller amplitude than the legs.
  armSwingMax: 0.6,
  // Crouch: sustained (not decaying) squash via the same bodyStretch value
  // used for landing/takeoff, active the whole time down is held grounded.
  // Eases in much faster than landing/takeoff (~5 frames at 60fps) since
  // this is a held pose transition, not an impact — should feel immediate.
  crouchSquash: -0.35,
  crouchEaseRate: 4.5,
  // Lean: tilts the upper body (not the legs) toward local-forward, scaled
  // by ground speed, for a more athletic running look.
  leanMax: 0.22,
  leanEaseRate: 4, // radians/sec
  // "Naruto run": once running at least narutoBlendStart of Ground Max Speed
  // AND committed to one direction for narutoMinDistance, arms blend from
  // the normal alternating swing into both sweeping back together. The
  // blend itself is time-based (narutoTransitionDuration), independent of
  // the fast per-frame leg/arm ease rate, so it reads as a deliberate raise
  // rather than a snap. Angle magnitude > PI/2 so the arms end up raised
  // behind, not just trailing at hip level (rotating a hanging arm past 90°
  // lifts it up).
  narutoArmAngle: -1.9,
  narutoBlendStart: 0.6,
  narutoMinDistance: 3,
  narutoTransitionDuration: 0.5, // seconds, both raising and lowering
};

// Strict 2D movement plane: only X (left/right) and Y (jumping) are
// simulated. STAGE_DEPTH is purely cosmetic, for rendering a stage with
// some visual thickness instead of a flat line.
const STAGE = { halfX: 11 };
const STAGE_DEPTH = 6.4;
const PLAYER_RADIUS = 0.4;

// Fixed timestep: physics always advances in 1/60s chunks regardless of
// render framerate, so the simulation stays deterministic — required to
// keep rollback netcode possible later even though v1 has no networking.
const FIXED_DT = 1 / 60;

// --- renderer / scene -------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 9, 17);
camera.lookAt(0, 3.8, 0); // aimed higher than before, so more sky and less
                          // foreground shows — gives headroom to see jumps

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 0.8);
sun.position.set(6, 12, 8);
scene.add(sun);

// --- stage -------------------------------------------------------------------
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(STAGE.halfX * 2 + 4, STAGE_DEPTH),
  new THREE.MeshStandardMaterial({ color: 0x3c9d4f })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

const grid = new THREE.GridHelper(STAGE.halfX * 2, 22, 0x1f5c2b, 0x2f7a3c);
grid.position.y = 0.01;
scene.add(grid);

// --- placeholder humanoid character ------------------------------------------
function buildCharacter() {
  const group = new THREE.Group();

  const hipHeight = 0.85;
  const thighLength = 0.44;
  const shinLength = 0.41; // thighLength + shinLength == hipHeight, so a
                            // fully straight leg (hip=0, knee=0) still
                            // reaches exactly to the ground, as before.
  const thighRadius = 0.115;
  const shinRadius = 0.095;

  // Both legs live under a "pelvis" pivot, positioned at hip height, so the
  // hips can twist (rotate around Y) independently of — and opposite to —
  // the upperBody's own twist below, for the athletic hip/shoulder
  // counter-rotation you get when one leg drives forward.
  const pelvis = new THREE.Group();
  pelvis.position.y = hipHeight;
  group.add(pelvis);

  // Two-segment leg: a hip pivot (offset along Z — the axis perpendicular
  // to facing, i.e. real anatomical left/right hip spacing) holds the
  // thigh, and a knee pivot nested INSIDE it (at the thigh's far end) holds
  // the shin. Rotating either pivot around Z swings that segment
  // forward/back in the character's local X-Y (facing) plane; the knee
  // pivot's rotation is relative to the thigh's, so a "bend" is just a
  // further backward rotation regardless of the thigh's current angle.
  // A small sphere at each pivot's origin doesn't move when that pivot
  // rotates (it's centered on the rotation axis), so it stays put and
  // visually bridges the joint gap that would otherwise open up mid-swing.
  function buildLeg(sideZ) {
    const hipPivot = new THREE.Group();
    hipPivot.position.set(0, 0, sideZ); // relative to pelvis, which is already at hip height

    const hipSocket = new THREE.Mesh(
      new THREE.SphereGeometry(thighRadius * 1.05, 8, 6),
      new THREE.MeshStandardMaterial({ color: 0x24418f })
    );
    hipPivot.add(hipSocket);

    const thigh = new THREE.Mesh(
      new THREE.CapsuleGeometry(thighRadius, thighLength - thighRadius * 2, 4, 8),
      new THREE.MeshStandardMaterial({ color: 0x24418f })
    );
    thigh.position.y = -thighLength / 2;
    hipPivot.add(thigh);

    const kneePivot = new THREE.Group();
    kneePivot.position.y = -thighLength;
    hipPivot.add(kneePivot);

    const kneeSocket = new THREE.Mesh(
      new THREE.SphereGeometry(shinRadius * 1.05, 8, 6),
      new THREE.MeshStandardMaterial({ color: 0x24418f })
    );
    kneePivot.add(kneeSocket);

    const shin = new THREE.Mesh(
      new THREE.CapsuleGeometry(shinRadius, shinLength - shinRadius * 2, 4, 8),
      new THREE.MeshStandardMaterial({ color: 0x24418f })
    );
    shin.position.y = -shinLength / 2;
    kneePivot.add(shin);

    pelvis.add(hipPivot);
    return { hipPivot, kneePivot };
  }
  const legL = buildLeg(-0.16);
  const legR = buildLeg(0.16);

  // Torso/head/arms live under a separate "upper body" pivot so the running
  // lean can tilt them without affecting the independently-animated legs.
  // Positioned AT hip height (not left at 0) so rotating it for the lean
  // pivots from the waist, where it actually meets the legs — otherwise it
  // rotates around a point down at ground level, swinging the torso through
  // an arc that visibly disconnects it from the hips.
  const upperBody = new THREE.Group();
  upperBody.position.y = hipHeight;
  group.add(upperBody);

  // Torso: a tapered cylinder — broader "shoulders" at the top, narrower
  // "waist" at the bottom — for an athletic V-taper silhouette. A capsule
  // can't taper (uniform radius along its length), so this switches
  // primitives rather than just resizing the old one.
  const torsoHeight = 0.72;
  const torsoRadiusTop = 0.33;    // shoulders
  const torsoRadiusBottom = 0.21; // waist
  const torso = new THREE.Mesh(
    new THREE.CylinderGeometry(torsoRadiusTop, torsoRadiusBottom, torsoHeight, 8),
    new THREE.MeshStandardMaterial({ color: 0x3060d0 })
  );
  torso.position.y = torsoHeight / 2; // relative to upperBody's origin, which is already at hip height
  upperBody.add(torso);

  // Neck: bridges the torso top and the head. This joint never rotates
  // independently (no head-turning animation yet), so unlike the knee/hip
  // it just needs a small overlap on each end rather than a socket sphere.
  const overlap = 0.03;
  const neckRadius = 0.10;
  const neckHeight = 0.16;
  const neckBottom = torsoHeight - overlap;
  const neck = new THREE.Mesh(
    new THREE.CylinderGeometry(neckRadius, neckRadius, neckHeight, 8),
    new THREE.MeshStandardMaterial({ color: 0xe8b98c })
  );
  neck.position.y = neckBottom + neckHeight / 2;
  upperBody.add(neck);

  const headRadius = 0.23;
  const headBottom = neckBottom + neckHeight - overlap;
  const headY = headBottom + headRadius;
  const head = new THREE.Mesh(
    new THREE.SphereGeometry(headRadius, 16, 12),
    new THREE.MeshStandardMaterial({ color: 0xe8b98c })
  );
  head.position.y = headY;
  upperBody.add(head);

  // Facing indicator ("nose"), so turn-around direction is readable at a glance.
  const nose = new THREE.Mesh(
    new THREE.ConeGeometry(0.09, headRadius, 8),
    new THREE.MeshStandardMaterial({ color: 0xff5040 })
  );
  nose.rotation.z = -Math.PI / 2;
  nose.position.set(headRadius, headY, 0);
  upperBody.add(nose);

  // Arms: same hinge-pivot pattern as the legs, offset along Z, shoulder-height.
  const shoulderHeight = torsoHeight - 0.1; // relative to upperBody's origin (already at hip height)
  const armLength = 0.62;
  const armRadius = 0.09;
  function buildArm(sideZ) {
    const pivot = new THREE.Group();
    pivot.position.set(0, shoulderHeight, sideZ);
    const arm = new THREE.Mesh(
      new THREE.CapsuleGeometry(armRadius, armLength - armRadius * 2, 4, 8),
      new THREE.MeshStandardMaterial({ color: 0x3060d0 })
    );
    arm.position.y = -armLength / 2;
    pivot.add(arm);
    upperBody.add(pivot);
    return pivot;
  }
  const armL = buildArm(-0.38);
  const armR = buildArm(0.38);

  return { group, legL, legR, armL, armR, upperBody, pelvis };
}
const { group: characterMesh, legL, legR, armL, armR, upperBody, pelvis } = buildCharacter();
scene.add(characterMesh);

// --- turn dust (minimal particle burst) --------------------------------------
// Cosmetic only, updated with real (render) delta time rather than the fixed
// physics step — never feeds back into simulation state, so using
// Math.random() here doesn't break determinism anywhere that matters.
const dustGeometry = new THREE.SphereGeometry(0.1, 6, 5);
const dustMaterial = new THREE.MeshStandardMaterial({ color: 0xc9b48a });
const dustParticles = [];

function spawnTurnDust(x, y) {
  for (let i = 0; i < 6; i++) {
    const mesh = new THREE.Mesh(dustGeometry, dustMaterial);
    mesh.position.set(x, y + 0.05, (Math.random() - 0.5) * 0.3);
    scene.add(mesh);
    dustParticles.push({
      mesh,
      vel: { x: (Math.random() - 0.5) * 3, y: Math.random() * 1.5 + 0.8, z: (Math.random() - 0.5) * 3 },
      life: 0,
      maxLife: 0.3 + Math.random() * 0.15,
    });
  }
}

function updateDustParticles(delta) {
  for (let i = dustParticles.length - 1; i >= 0; i--) {
    const p = dustParticles[i];
    p.life += delta;
    if (p.life >= p.maxLife) {
      scene.remove(p.mesh);
      dustParticles.splice(i, 1);
      continue;
    }
    p.vel.y -= 6 * delta;
    p.mesh.position.x += p.vel.x * delta;
    p.mesh.position.y += p.vel.y * delta;
    p.mesh.position.z += p.vel.z * delta;
    p.mesh.scale.setScalar(Math.max(1 - p.life / p.maxLife, 0.001));
  }
}

// --- input --------------------------------------------------------------------
// Digital-first input: keyboard is on/off by nature, and gamepad stick input
// is quantized to -1/0/1 too, so both feel equivalent (controller analog
// nuance can be layered on top later — see design log).
const heldKeys = new Set();
let jumpQueued = false;
window.addEventListener('keydown', e => {
  heldKeys.add(e.code);
  // e.repeat is true for OS key-repeat while a key is held down — ignoring
  // it means holding Space triggers one jump, not an automatic double jump.
  if (e.code === 'Space' && !e.repeat) jumpQueued = true;
});
window.addEventListener('keyup', e => heldKeys.delete(e.code));

let prevGamepadJumpHeld = false;

function readInput() {
  let dirX = 0;
  if (heldKeys.has('ArrowLeft') || heldKeys.has('KeyA')) dirX -= 1;
  if (heldKeys.has('ArrowRight') || heldKeys.has('KeyD')) dirX += 1;
  let downHeld = heldKeys.has('ArrowDown') || heldKeys.has('KeyS');

  const pad = navigator.getGamepads ? navigator.getGamepads()[0] : null;
  if (pad) {
    const DEAD_ZONE = 0.35;
    if (dirX === 0 && Math.abs(pad.axes[0]) > DEAD_ZONE) dirX = Math.sign(pad.axes[0]);
    if (!downHeld && pad.axes[1] > DEAD_ZONE) downHeld = true;
    if (!downHeld && pad.buttons[13] && pad.buttons[13].pressed) downHeld = true; // D-pad down

    const jumpHeld = !!(pad.buttons[0] && pad.buttons[0].pressed);
    if (jumpHeld && !prevGamepadJumpHeld) jumpQueued = true;
    prevGamepadJumpHeld = jumpHeld;
  }
  return { dirX, downHeld };
}

// --- player state ---------------------------------------------------------
const player = {
  pos: { x: 0, y: 0 },
  prevPos: { x: 0, y: 0 },
  vel: { x: 0, y: 0 },
  grounded: true,
  hasDoubleJump: true,
  facing: 0,        // visual yaw, radians (0 = facing +X, PI = facing -X)
  targetFacing: 0,
  fastFalling: false,
  wasReversalInput: false, // for edge-detecting turn-dust triggers
  doubleJumpFlipTimer: 0,
  jumpPoseFlipped: false, // which side is "active" (raised leg + sword arm)
  airTime: 0, // seconds since the current jump started, drives the pose wiggle
  bodyStretch: 0,   // negative = squashed, positive = stretched, eases to 0
  gaitPhase: 0,
  legAngleL: 0,
  legAngleR: 0,
  kneeAngleL: 0,
  kneeAngleR: 0,
  armAngleL: 0,
  armAngleR: 0,
  upperBodyLean: 0,
  bodyTwist: 0, // pelvis yaw twist; upperBody twists opposite this while airborne
  sameDirDistance: 0, // resets whenever travel direction changes
  lastMoveDir: 0,
  narutoBlendFactor: 0, // 0-1, eases over narutoTransitionDuration either way
};

function moveToward(current, target, maxDelta) {
  if (Math.abs(target - current) <= maxDelta) return target;
  return current + Math.sign(target - current) * maxDelta;
}

function doJump(speed) {
  player.vel.y = speed;
  player.grounded = false;
  player.fastFalling = false; // a fresh jump needs a fresh fast-fall input
  player.bodyStretch = ANIM.takeoffStretchKick;
  player.airTime = 0; // restarts the jump-pose wiggle phase each jump
  // Clamp horizontal speed to the air-speed cap the instant you leave the
  // ground, rather than letting ground momentum carry through unchanged.
  // A small gap between Ground Max Speed and Max Air Speed barely clips
  // anything; a big gap (like ours) causes a real, felt loss of speed on
  // takeoff — matching real Melee's behavior for fast-ground characters.
  player.vel.x = Math.max(-STATS.maxAirSpeed, Math.min(STATS.maxAirSpeed, player.vel.x));
}

function fixedUpdate(dt, input) {
  player.prevPos.x = player.pos.x;
  player.prevPos.y = player.pos.y;

  const { dirX, downHeld } = input;

  // Turn dust: fires once, right when you newly try to move opposite your
  // current velocity, if you were going at least turnDustSpeedFraction of
  // Ground Max Speed at that moment (checked BEFORE this tick's physics).
  const isReversalInput = player.grounded && dirX !== 0 && player.vel.x !== 0 &&
    Math.sign(dirX) !== Math.sign(player.vel.x);
  if (isReversalInput && !player.wasReversalInput &&
      Math.abs(player.vel.x) > STATS.groundMaxSpeed * ANIM.turnDustSpeedFraction) {
    spawnTurnDust(player.pos.x, player.pos.y);
  }
  player.wasReversalInput = isReversalInput;

  if (player.grounded) {
    // Can't accelerate while crouching (holding down) — existing speed
    // bleeds off via normal deceleration instead, so you skid to a stop
    // rather than sprinting in a squashed pose.
    const moveDirX = downHeld ? 0 : dirX;
    player.vel.x = moveDirX !== 0
      ? moveToward(player.vel.x, STATS.groundMaxSpeed * moveDirX, STATS.groundAccel * dt)
      : moveToward(player.vel.x, 0, STATS.groundDecel * dt);
  } else {
    // Fast-fall: pressing down while already moving downward instantly
    // snaps to a faster terminal velocity for the rest of this fall.
    if (!player.fastFalling && downHeld && player.vel.y <= 0) {
      player.fastFalling = true;
      player.vel.y = -STATS.fastFallSpeed;
    }
    const fallCap = player.fastFalling ? STATS.fastFallSpeed : STATS.maxFallSpeed;
    player.vel.y = Math.max(player.vel.y - STATS.gravity * dt, -fallCap);
    if (dirX !== 0) {
      player.vel.x += STATS.airAccel * dirX * dt;
      player.vel.x = Math.max(-STATS.maxAirSpeed, Math.min(STATS.maxAirSpeed, player.vel.x));
    } else {
      player.vel.x = moveToward(player.vel.x, 0, STATS.airFriction * dt);
    }
  }

  if (jumpQueued) {
    jumpQueued = false;
    if (player.grounded) {
      doJump(STATS.jumpSpeed);
      player.jumpPoseFlipped = false; // first jump always starts in the default orientation
    } else if (player.hasDoubleJump) {
      player.hasDoubleJump = false;
      doJump(STATS.doubleJumpSpeed);
      player.doubleJumpFlipTimer = ANIM.doubleJumpTuckDuration;
      player.jumpPoseFlipped = true; // double jump swaps which leg/arm is active
    }
  }

  player.pos.x += player.vel.x * dt;
  player.pos.y += player.vel.y * dt;

  if (!player.grounded && player.pos.y <= 0 && player.vel.y <= 0) {
    player.pos.y = 0;
    player.vel.y = 0;
    player.grounded = true;
    player.hasDoubleJump = true;
    player.fastFalling = false;
    player.bodyStretch = ANIM.landingSquashKick;
  }

  // Crouch: holding down while grounded sustains a squash target instead of
  // the momentary landing/takeoff kicks easing back to 0. Uses the same
  // bodyStretch value/mechanism, just a held target rather than an impulse.
  const crouching = player.grounded && downHeld;
  const stretchTarget = crouching ? ANIM.crouchSquash : 0;
  const stretchRate = crouching ? ANIM.crouchEaseRate : ANIM.stretchEaseRate;
  player.bodyStretch = moveToward(player.bodyStretch, stretchTarget, stretchRate * dt);

  const maxX = STAGE.halfX - PLAYER_RADIUS;
  if (player.pos.x > maxX) { player.pos.x = maxX; player.vel.x = 0; }
  if (player.pos.x < -maxX) { player.pos.x = -maxX; player.vel.x = 0; }

  // Turn-around (grounded only): physics velocity flips instantly, and the
  // visual facing eases toward it quickly rather than snapping. Facing
  // never changes while airborne, no exceptions — matches Melee's
  // normal-character behavior (only Kirby/Jigglypuff can turn around via
  // jump there, which we're not modeling).
  if (player.grounded && dirX !== 0) player.targetFacing = dirX > 0 ? 0 : Math.PI;
  const TURN_RATE = Math.PI * 12; // radians/sec
  let diff = player.targetFacing - player.facing;
  diff = Math.atan2(Math.sin(diff), Math.cos(diff));
  const maxTurn = TURN_RATE * dt;
  player.facing += Math.max(-maxTurn, Math.min(maxTurn, diff));

  // Same-direction commitment tracking: resets the instant travel direction
  // changes, so quick dash-dance taps never accumulate enough distance to
  // trigger the Naruto-run pose below.
  if (player.grounded && player.vel.x !== 0) {
    const moveDir = Math.sign(player.vel.x);
    if (moveDir !== player.lastMoveDir) {
      player.sameDirDistance = 0;
      player.lastMoveDir = moveDir;
    } else {
      player.sameDirDistance += Math.abs(player.vel.x) * dt;
    }
  } else {
    player.sameDirDistance = 0;
    player.lastMoveDir = 0;
  }

  // Leg animation: gait cycle speed/amplitude scale with ground speed, so
  // it naturally eases to a standstill as the character decelerates. While
  // airborne, both legs ease to a fixed tucked pose instead of continuing
  // the cycle (phase is frozen mid-stride and resumes there on landing).
  const speedFrac = Math.min(1, Math.abs(player.vel.x) / STATS.groundMaxSpeed);

  if (!player.grounded) player.airTime += dt;
  // Small continuous sine wiggle applied to the jump pose's "active" limbs
  // (raised leg + sword arm) so a long hang time doesn't read as frozen.
  const jumpPoseWiggle = ANIM.jumpPoseWiggleAmplitude * Math.sin(player.airTime * ANIM.jumpPoseWiggleFreq);

  let targetLegL, targetLegR, targetKneeL, targetKneeR;
  if (player.grounded) {
    player.gaitPhase += 2 * Math.PI * ANIM.gaitCyclesPerSecAtMax * speedFrac * dt;
    targetLegL = ANIM.legSwingMax * speedFrac * Math.sin(player.gaitPhase);
    targetLegR = ANIM.legSwingMax * speedFrac * Math.sin(player.gaitPhase + Math.PI);
    // Knee bend: a half-wave-rectified cosine peaks when the hip is at
    // neutral swinging forward (cos(phase)=1, foot lifting for clearance)
    // and is clamped to zero for the half-cycle around stance/push-off
    // (cos(phase)<0), so only the swinging leg's knee bends at a time.
    targetKneeL = ANIM.kneeBendMax * speedFrac * Math.max(0, Math.cos(player.gaitPhase));
    targetKneeR = ANIM.kneeBendMax * speedFrac * Math.max(0, Math.cos(player.gaitPhase + Math.PI));
  } else if (player.doubleJumpFlipTimer > 0) {
    // Brief, tighter tuck right after a double jump, then relaxes back to
    // the normal airborne pose once the timer runs out.
    player.doubleJumpFlipTimer -= dt;
    targetLegL = ANIM.doubleJumpTuckAngle;
    targetLegR = ANIM.doubleJumpTuckAngle;
    targetKneeL = ANIM.doubleJumpTuckAngle;
    targetKneeR = ANIM.doubleJumpTuckAngle;
  } else {
    // Which leg drives up vs trails flips between the first jump and the
    // double jump (player.jumpPoseFlipped), so it's not the same pose every
    // time. The raised leg also gets the continuous wiggle above.
    const raisedLegAngle = ANIM.jumpPoseRaisedLegAngle + jumpPoseWiggle;
    if (player.jumpPoseFlipped) {
      targetLegL = ANIM.jumpPoseLegAngle;
      targetLegR = raisedLegAngle;
      targetKneeL = ANIM.jumpPoseKneeAngle;
      targetKneeR = ANIM.jumpPoseRaisedKneeAngle;
    } else {
      targetLegL = raisedLegAngle;
      targetLegR = ANIM.jumpPoseLegAngle;
      targetKneeL = ANIM.jumpPoseRaisedKneeAngle;
      targetKneeR = ANIM.jumpPoseKneeAngle;
    }
  }
  const maxLegDelta = ANIM.legEaseRate * dt;
  player.legAngleL = moveToward(player.legAngleL, targetLegL, maxLegDelta);
  player.legAngleR = moveToward(player.legAngleR, targetLegR, maxLegDelta);
  player.kneeAngleL = moveToward(player.kneeAngleL, targetKneeL, maxLegDelta);
  player.kneeAngleR = moveToward(player.kneeAngleR, targetKneeR, maxLegDelta);

  // Hip/shoulder counter-rotation: pelvis twists to bring the raised leg's
  // hip forward (legL is at sideZ<0, so bringing it forward needs a
  // negative pelvis yaw — see design log for the rotation-direction math);
  // upperBody twists the opposite way in the render loop. Only while
  // airborne, in the jump pose — no twist while grounded.
  const hipTwistTarget = player.grounded ? 0 : (player.jumpPoseFlipped ? ANIM.bodyTwistMax : -ANIM.bodyTwistMax);
  player.bodyTwist = moveToward(player.bodyTwist, hipTwistTarget, ANIM.bodyTwistEaseRate * dt);

  // Naruto-run blend: a smooth 0-1 value that only ramps toward 1 while
  // BOTH gate conditions hold (fast enough, committed far enough), and
  // ramps back toward 0 the instant either stops holding. This is a
  // time-based ease (narutoTransitionDuration), separate from the fast
  // per-frame arm ease rate below, so the pose reads as a deliberate raise
  // rather than snapping in the moment the distance threshold is crossed.
  const narutoGateOpen = speedFrac >= ANIM.narutoBlendStart &&
    player.sameDirDistance >= ANIM.narutoMinDistance;
  player.narutoBlendFactor = moveToward(
    player.narutoBlendFactor,
    narutoGateOpen ? 1 : 0,
    (1 / ANIM.narutoTransitionDuration) * dt
  );

  // Arms: contralateral to the legs (armL shares legR's phase and vice
  // versa), reusing the same gaitPhase/speedFrac so they stay in lockstep.
  // Blends into both arms held back together ("Naruto run") per the factor above.
  let targetArmL, targetArmR;
  if (player.grounded) {
    const normalArmL = ANIM.armSwingMax * speedFrac * Math.sin(player.gaitPhase + Math.PI);
    const normalArmR = ANIM.armSwingMax * speedFrac * Math.sin(player.gaitPhase);
    targetArmL = normalArmL + (ANIM.narutoArmAngle - normalArmL) * player.narutoBlendFactor;
    targetArmR = normalArmR + (ANIM.narutoArmAngle - normalArmR) * player.narutoBlendFactor;
  } else {
    // Sword arm flips sides along with the raised leg (player.jumpPoseFlipped),
    // staying opposite the raised leg, and shares its wiggle.
    const swordArmAngle = ANIM.jumpPoseSwordArmAngle + jumpPoseWiggle;
    if (player.jumpPoseFlipped) {
      targetArmL = swordArmAngle;
      targetArmR = ANIM.jumpPoseOffArmAngle;
    } else {
      targetArmL = ANIM.jumpPoseOffArmAngle;
      targetArmR = swordArmAngle;
    }
  }
  player.armAngleL = moveToward(player.armAngleL, targetArmL, maxLegDelta);
  player.armAngleR = moveToward(player.armAngleR, targetArmR, maxLegDelta);

  // Lean: tilts the upper body toward local-forward, scaled by ground speed.
  // Defined relative to the character's own facing (not world direction),
  // so it automatically points the right way after the parent's yaw.
  const leanTarget = player.grounded ? -ANIM.leanMax * speedFrac : 0;
  player.upperBodyLean = moveToward(player.upperBodyLean, leanTarget, ANIM.leanEaseRate * dt);
}

// --- main loop ---------------------------------------------------------------
const hud = document.getElementById('hud');
let accumulator = 0;
let lastTime = performance.now();

function frame(now) {
  requestAnimationFrame(frame);
  let delta = (now - lastTime) / 1000;
  lastTime = now;
  delta = Math.min(delta, 0.25); // avoid spiral of death after a tab stall
  accumulator += delta;

  // Input is sampled once per rendered frame and reused for every fixed
  // step that frame. Real rollback netcode will need input pulled from a
  // per-simulated-tick buffer instead — that's future networking work.
  const input = readInput();
  while (accumulator >= FIXED_DT) {
    fixedUpdate(FIXED_DT, input);
    accumulator -= FIXED_DT;
  }

  const alpha = accumulator / FIXED_DT;
  characterMesh.position.set(
    player.prevPos.x + (player.pos.x - player.prevPos.x) * alpha,
    player.prevPos.y + (player.pos.y - player.prevPos.y) * alpha,
    0
  );
  characterMesh.rotation.y = player.facing;
  characterMesh.scale.set(
    1 - player.bodyStretch * 0.5,
    1 + player.bodyStretch,
    1 - player.bodyStretch * 0.5
  );
  legL.hipPivot.rotation.z = player.legAngleL;
  legR.hipPivot.rotation.z = player.legAngleR;
  // Knee bend is negative (backward) relative to the thigh's own rotation —
  // knees only bend one way, regardless of the thigh's current swing angle.
  legL.kneePivot.rotation.z = -player.kneeAngleL;
  legR.kneePivot.rotation.z = -player.kneeAngleR;
  armL.rotation.z = player.armAngleL;
  armR.rotation.z = player.armAngleR;
  upperBody.rotation.z = player.upperBodyLean;
  pelvis.rotation.y = player.bodyTwist;
  upperBody.rotation.y = -player.bodyTwist * ANIM.shoulderCounterTwistFactor;
  updateDustParticles(delta);

  const speed = Math.abs(player.vel.x);
  hud.innerHTML =
    `<b>Move:</b> WASD / Arrow Keys &nbsp; <b>Jump:</b> Space (double jump in air) &nbsp; <b>Down:</b> crouch (grounded) / fast-fall (airborne) &nbsp; <b>Gamepad:</b> left stick + A/Cross<br>` +
    `speed: ${speed.toFixed(1)} &nbsp; vel.y: ${player.vel.y.toFixed(1)} &nbsp; grounded: ${player.grounded} &nbsp; double jump ready: ${player.hasDoubleJump} &nbsp; fast-falling: ${player.fastFalling}`;

  renderer.render(scene, camera);
}
requestAnimationFrame(frame);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
